name: Build Wauz Kart Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Windows EXE
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name wauzkart --icon assets\icon.ico --paths src --hidden-import wauzkart.app --add-data "assets;assets" wauz_kart.py

      - name: Prepare Windows installer
        run: |
          Copy-Item dist\wauzkart.exe wauzkart-windows.exe

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: wauzkart-windows
          path: wauzkart-windows.exe

  build-linux:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxcb-xfixes0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Linux binary
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name wauzkart-linux --paths src --hidden-import wauzkart.app --add-data "assets:assets" wauz_kart.py
          chmod +x dist/wauzkart-linux

      - name: Package Linux AppImage
        run: |
          mkdir -p WauzKart.AppDir/usr/bin
          cp dist/wauzkart-linux WauzKart.AppDir/usr/bin/wauzkart
          chmod +x WauzKart.AppDir/usr/bin/wauzkart
          cp assets/icon.png WauzKart.AppDir/wauzkart.png
          cat > WauzKart.AppDir/AppRun <<'SH'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/wauzkart" "$@"
          SH
          chmod +x WauzKart.AppDir/AppRun
          cat > WauzKart.AppDir/wauzkart.desktop <<'DESKTOP'
          [Desktop Entry]
          Type=Application
          Name=Wauz Kart
          Exec=wauzkart
          Icon=wauzkart
          Categories=Game;
          Terminal=false
          DESKTOP
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool WauzKart.AppDir wauzkart-linux.AppImage
          chmod +x wauzkart-linux.AppImage

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: wauzkart-linux
          path: wauzkart-linux.AppImage

  build-macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build macOS app
        run: |
          pyinstaller --noconfirm --clean --windowed --name wauzkart-macos --paths src --hidden-import wauzkart.app --add-data "assets:assets" wauz_kart.py

      - name: Package macOS DMG
        run: |
          hdiutil create -volname "Wauz Kart" -srcfolder dist/wauzkart-macos.app -ov -format UDZO wauzkart-macos.dmg

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: wauzkart-macos
          path: wauzkart-macos.dmg

  release:
    name: Publish Release
    runs-on: ubuntu-latest
    needs:
      - build-windows
      - build-linux
      - build-macos
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/**/*.exe
            release-assets/**/*.AppImage
            release-assets/**/*.dmg
          generate_release_notes: true
