name: Build Wauz Kart Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Windows EXE
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name wauzkart --icon assets\icon.ico --paths src --hidden-import wauzkart.app --add-data "assets;assets" wauz_kart.py

      - name: Prepare Windows installer
        run: |
          Copy-Item dist\wauzkart.exe wauzkart-windows.exe

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: wauzkart-windows
          path: wauzkart-windows.exe

  build-linux:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libfuse2t64 libasound2t64 libpulse0 libpulse-mainloop-glib0 libgstreamer-plugins-base1.0-0 gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-pulseaudio gstreamer1.0-alsa libqt5multimedia5-plugins libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xfixes0 libxkbcommon-x11-0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Linux binary
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name wauzkart-linux --paths src --hidden-import wauzkart.app --collect-submodules OpenGL --collect-data OpenGL --hidden-import OpenGL.platform.egl --hidden-import OpenGL.platform.glx --hidden-import OpenGL.platform.x11 --hidden-import OpenGL.platform.ctypesloader --hidden-import PyQt5.QtMultimedia --add-data "assets:assets" wauz_kart.py
          chmod +x dist/wauzkart-linux

      - name: Package Linux AppImage
        run: |
          mkdir -p WauzKart.AppDir/usr/bin
          cp dist/wauzkart-linux WauzKart.AppDir/usr/bin/wauzkart
          chmod +x WauzKart.AppDir/usr/bin/wauzkart
          cp assets/icon.png WauzKart.AppDir/wauzkart.png
          cat > WauzKart.AppDir/AppRun <<'SH'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/wauzkart" "$@"
          SH
          chmod +x WauzKart.AppDir/AppRun
          cat > WauzKart.AppDir/wauzkart.desktop <<'DESKTOP'
          [Desktop Entry]
          Type=Application
          Name=Wauz Kart
          Exec=wauzkart
          Icon=wauzkart
          Categories=Game;
          Terminal=false
          DESKTOP
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool WauzKart.AppDir wauzkart-linux.AppImage
          chmod +x wauzkart-linux.AppImage

      - name: Package Linux DEB
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "$GITHUB_REF_NAME" ]; then
            VERSION="1.0.0"
          fi
          mkdir -p WauzKartDeb/DEBIAN
          mkdir -p WauzKartDeb/opt/wauzkart
          mkdir -p WauzKartDeb/usr/bin
          mkdir -p WauzKartDeb/usr/share/applications
          mkdir -p WauzKartDeb/usr/share/pixmaps
          cp dist/wauzkart-linux WauzKartDeb/opt/wauzkart/wauzkart
          chmod 755 WauzKartDeb/opt/wauzkart/wauzkart
          cp assets/icon.png WauzKartDeb/usr/share/pixmaps/wauzkart.png
          ln -s /opt/wauzkart/wauzkart WauzKartDeb/usr/bin/wauzkart
          cat > WauzKartDeb/DEBIAN/control <<DEB
          Package: wauzkart
          Version: $VERSION
          Section: games
          Priority: optional
          Architecture: amd64
          Maintainer: Wauz Kart
          Depends: libgl1, libegl1, libasound2t64 | libasound2, libpulse0, libpulse-mainloop-glib0, libgstreamer-plugins-base1.0-0, gstreamer1.0-plugins-base, gstreamer1.0-plugins-good, gstreamer1.0-pulseaudio, gstreamer1.0-alsa, libqt5multimedia5-plugins, libxcb-cursor0, libxcb-icccm4, libxcb-image0, libxcb-keysyms1, libxcb-randr0, libxcb-render-util0, libxcb-shape0, libxcb-xinerama0, libxcb-xfixes0, libxkbcommon-x11-0
          Description: Wauz Kart racing game
           Wauz Kart is a standalone kart racing game with LAN multiplayer.
          DEB
          cat > WauzKartDeb/usr/share/applications/wauzkart.desktop <<DESKTOP
          [Desktop Entry]
          Type=Application
          Name=Wauz Kart
          Exec=wauzkart
          Icon=wauzkart
          Categories=Game;
          Terminal=false
          DESKTOP
          dpkg-deb --build WauzKartDeb wauzkart-linux.deb

      - name: Prepare Linux installer script
        run: |
          cp scripts/install-wauzkart-linux.sh install-wauzkart-linux.sh
          chmod +x install-wauzkart-linux.sh

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: wauzkart-linux
          path: |
            wauzkart-linux.AppImage
            wauzkart-linux.deb
            install-wauzkart-linux.sh

  build-macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build macOS app
        run: |
          pyinstaller --noconfirm --clean --windowed --name wauzkart-macos --paths src --hidden-import wauzkart.app --add-data "assets:assets" wauz_kart.py

      - name: Package macOS DMG
        run: |
          hdiutil create -volname "Wauz Kart" -srcfolder dist/wauzkart-macos.app -ov -format UDZO wauzkart-macos.dmg

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: wauzkart-macos
          path: wauzkart-macos.dmg

  release:
    name: Publish Release
    runs-on: ubuntu-latest
    needs:
      - build-windows
      - build-linux
      - build-macos
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/**/*.exe
            release-assets/**/*.AppImage
            release-assets/**/*.deb
            release-assets/**/*.sh
            release-assets/**/*.dmg
          generate_release_notes: true
