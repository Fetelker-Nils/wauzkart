[project]
name = "wauzcart"
version = "0.1.0"
description = "Standalone Wauz Kart game project"
requires-python = ">=3.10"
dependencies = [
    "PyQt5",
    "PyOpenGL",
]

[project.scripts]
wauzcart = "wauzcart.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
